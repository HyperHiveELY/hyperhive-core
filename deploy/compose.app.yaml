# API and AI/audit worker. Deploy behind an HTTPS reverse proxy at PUBLIC_ORIGIN.
# Set HYPERHIVE_IMAGE to the built image's immutable registry digest.
services:
  api:
    image: ${HYPERHIVE_IMAGE:?Set a registry image digest}
    restart: unless-stopped
    env_file: app.env
    command: ["npm", "start"]
    ports: ["127.0.0.1:8788:8788"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: ${HYPERHIVE_IMAGE:?Set a registry image digest}
    restart: unless-stopped
    env_file: worker.env
    command: ["npm", "run", "worker"]
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "scripts/service-health.ts", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  notifications:
    image: ${HYPERHIVE_IMAGE:?Set a registry image digest}
    restart: unless-stopped
    env_file: app.env
    command: ["npm", "run", "notifications"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
